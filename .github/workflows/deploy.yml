name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # If the application directory does not exist, create it and clone the repository
            if [ ! -d "/app/portal-dashboard" ]; then
              mkdir -p /app
              cd /app
              git clone https://github.com/cesarfois/PortalDashboard.git portal-dashboard
            fi
            
            # Go to the application directory
            cd /app/portal-dashboard
            
            # Pull the latest code
            git pull origin main
            
            # Create required external networks if they don't exist
            docker network create pedidodecompradematerial_default || true
            docker network create pedidodepagamento_default || true
            docker network create facturacaodeservicos_default || true
            
            # Rebuild and restart the containers
            docker compose down --remove-orphans
            docker compose up -d --build

