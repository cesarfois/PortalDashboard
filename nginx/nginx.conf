events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Enable logging for debugging proxy passes
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # HTTP server (redirects all traffic to HTTPS, except certbot challenge)
    server {
        listen 80;
        server_name wp.processcloud.app;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server (Active SSL)
    server {
        listen 443 ssl;
        server_name wp.processcloud.app;
        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/letsencrypt/live/wp.processcloud.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wp.processcloud.app/privkey.pem;

        # SSL optimization settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Primary Portal gateway (catches /, /login, /portal, /admin, static files, and APIs)
        location / {
            proxy_pass http://portal:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Specific exact locations for portal authentication APIs
        location = /api/auth/login {
            proxy_pass http://portal:3000/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/auth/logout {
            proxy_pass http://portal:3000/api/auth/logout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/auth/me {
            proxy_pass http://portal:3000/api/auth/me;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Authentication check subrequest endpoint
        location = /api/auth/verify {
            proxy_pass http://portal:3000/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Remote-Addr $remote_addr;
            proxy_set_header X-Original-Host $host;
        }

        # Specific prefix location for portal administration APIs
        location /api/admin/ {
            proxy_pass http://portal:3000/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Catch-all for other APIs, routed to the compras dashboard (rcsvision-app)
        location /api/ {
            set $upstream_compras http://rcsvision-app:3001;
            proxy_pass $upstream_compras;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Standalone Workflow Diagram - ALLOW ANONYMOUS ACCESS
        location /compras/workflow-diagram {
            set $upstream_compras_web http://rcsvision-app:3001;
            rewrite ^/compras/(.*)$ /$1 break;
            proxy_pass $upstream_compras_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard: Compra de Material
        location /compras/ {
            auth_request /api/auth/verify;
            error_page 401 = @error401;
            error_page 403 = @error403;

            set $upstream_compras_web http://rcsvision-app:3001;
            rewrite ^/compras/(.*)$ /$1 break;
            proxy_pass $upstream_compras_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard: Importação
        location /importacao/ {
            auth_request /api/auth/verify;
            error_page 401 = @error401;
            error_page 403 = @error403;

            set $upstream_importacao http://rcsvision-importacao-app:3012;
            rewrite ^/importacao/(.*)$ /$1 break;
            proxy_pass $upstream_importacao;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard: Pedido de Pagamento
        location = /pedido-de-pagamento {
            return 301 $scheme://$host/pedido-de-pagamento/;
        }

        location /pedido-de-pagamento/ {
            auth_request /api/auth/verify;
            error_page 401 = @error401;
            error_page 403 = @error403;

            set $upstream_pagamentos http://rcsvision-pagamento-app:3001;
            rewrite ^/pedido-de-pagamento/(.*)$ /$1 break;
            proxy_pass $upstream_pagamentos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard: Faturação de Serviços
        location = /faturacao-servicos {
            return 301 $scheme://$host/faturacao-servicos/;
        }

        location /faturacao-servicos/ {
            auth_request /api/auth/verify;
            error_page 401 = @error401;
            error_page 403 = @error403;

            set $upstream_faturacao http://rcsvision-faturacao-app:3001;
            rewrite ^/faturacao-servicos/(.*)$ /$1 break;
            proxy_pass $upstream_faturacao;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard: Pedido de Transporte
        location = /pedido-de-transporte {
            return 301 $scheme://$host/pedido-de-transporte/;
        }

        location /pedido-de-transporte/ {
            auth_request /api/auth/verify;
            error_page 401 = @error401;
            error_page 403 = @error403;

            set $upstream_transporte http://rcsvision-pedido-transporte-app:3001;
            rewrite ^/pedido-de-transporte/(.*)$ /$1 break;
            proxy_pass $upstream_transporte;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard: Workflow KPI Analytics
        location /workflow-kpi-analytics/ {
            auth_request /api/auth/verify;
            error_page 401 = @error401;
            error_page 403 = @error403;

            set $upstream_kpi_analytics http://workflow-kpi-analytics-app:3001;
            rewrite ^/workflow-kpi-analytics/(.*)$ /$1 break;
            proxy_pass $upstream_kpi_analytics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard: KPI Analytics Redirect and Proxy
        location = /kpi-analytics {
            return 301 $scheme://$host/kpi-analytics/;
        }

        location /kpi-analytics/ {
            auth_request /api/auth/verify;
            error_page 401 = @error401;
            error_page 403 = @error403;

            set $upstream_kpi_analytics http://workflow-kpi-analytics-app:3001;
            rewrite ^/kpi-analytics/(.*)$ /$1 break;
            proxy_pass $upstream_kpi_analytics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect Vite static assets to rcsvision-app
        location /assets/ {
            set $upstream_assets http://rcsvision-app:3001;
            proxy_pass $upstream_assets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /vite.svg {
            set $upstream_vite http://rcsvision-app:3001;
            proxy_pass $upstream_vite;
            proxy_set_header Host $host;
        }

        # Redirect DocuWare API requests to rcsvision-app
        location /DocuWare/ {
            set $upstream_docuware http://rcsvision-app:3001;
            proxy_pass $upstream_docuware;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect unauthorized/non-authenticated sessions to login
        location @error401 {
            return 302 /login?redirect=$request_uri;
        }

        # Handle forbidden dashboard access (auth verified but user lacks permission)
        location @error403 {
            default_type text/html;
            return 403 "<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <meta charset='UTF-8'>
    <title>Acesso Negado</title>
    <link rel='stylesheet' href='/css/style.css'>
</head>
<body style='display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0;'>
    <div class='glass-panel' style='text-align:center; max-width:480px; padding:3rem 2rem;'>
        <span style='font-size:3.5rem; display:block; margin-bottom:1rem;'>🔒</span>
        <h2 style='font-weight:700; margin-bottom:1rem;'>Acesso Não Autorizado</h2>
        <p style='color:var(--text-secondary); line-height:1.6; margin-bottom:2rem;'>
            Sua conta não tem permissão para acessar este painel. Entre em contato com o administrador para solicitar liberação.
        </p>
        <a href='/portal' class='btn btn-primary' style='display:inline-block;'>Voltar ao Portal</a>
    </div>
</body>
</html>";
        }
    }

    # HTTP server for learn.processcloud.app (redirects all traffic to HTTPS, except certbot challenge)
    server {
        listen 80;
        server_name learn.processcloud.app;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server for learn.processcloud.app (Active SSL)
    server {
        listen 443 ssl;
        server_name learn.processcloud.app;
        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/letsencrypt/live/learn.processcloud.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/learn.processcloud.app/privkey.pem;

        # SSL optimization settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Check authorization from the main portal
        auth_request /api/auth/verify;
        error_page 401 = @error401;
        error_page 403 = @error403;

        location / {
            proxy_pass http://13.140.173.35:3008;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Authentication check subrequest endpoint
        location = /api/auth/verify {
            proxy_pass http://portal:3000/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Remote-Addr $remote_addr;
            proxy_set_header X-Original-Host $host;
        }

        # Redirect unauthorized/non-authenticated sessions to login
        location @error401 {
            return 302 https://wp.processcloud.app/login?redirect=$scheme://$host$request_uri;
        }

        # Handle forbidden access
        location @error403 {
            default_type text/html;
            return 403 "<!DOCTYPE html>
