<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Pedido de Pagamento</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090916 0%, #171120 100%);
      --panel-bg: rgba(31, 41, 55, 0.45);
      --panel-border: rgba(255, 255, 255, 0.08);
      --primary: #ec4899;
      --primary-hover: #db2777;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 2rem;
    }
    header {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .badge {
      background: rgba(236, 72, 153, 0.15);
      color: #fbcfe8;
      border: 1px solid rgba(236, 72, 153, 0.3);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .btn-back {
      color: var(--text-primary);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--panel-border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    .btn-back:hover {
      background: rgba(255,255,255,0.1);
      transform: translateX(-3px);
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .glass-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .metric-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      padding: 1.5rem;
      border-radius: 12px;
    }
    .metric-card h4 {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .metric-card p {
      font-size: 1.75rem;
      font-weight: 700;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }
    @media (min-width: 768px) {
      .chart-grid { grid-template-columns: 1fr 1fr; }
    }
    .chart-container {
      background: rgba(10, 15, 30, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1.5rem;
      min-height: 320px;
    }
    .chart-container h3 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-title">
      <span style="font-size: 1.5rem;">💸</span>
      <h2 style="font-size: 1.25rem;">Pedido de Pagamento</h2>
      <span class="badge">Painel Financeiro</span>
    </div>
    <a href="/portal" class="btn-back">&larr; Voltar ao Portal</a>
  </header>

  <main class="container">
    <div class="glass-panel">
      <div class="metrics-grid">
        <div class="metric-card">
          <h4>Solicitações Realizadas</h4>
          <p>98</p>
        </div>
        <div class="metric-card">
          <h4>Total Pago (Mês)</h4>
          <p>R$ 143.220,00</p>
        </div>
        <div class="metric-card">
          <h4>Aguardando Liquidação</h4>
          <p style="color: #ec4899;">12</p>
        </div>
        <div class="metric-card">
          <h4>Tempo Médio para Pago</h4>
          <p style="color: #34d399;">2.4 Dias</p>
        </div>
      </div>

      <div class="chart-grid">
        <div class="chart-container">
          <h3>Status de Solicitações</h3>
          <canvas id="statusChart"></canvas>
        </div>
        <div class="chart-container">
          <h3>Natureza dos Pedidos</h3>
          <canvas id="natureChart"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const gridColor = 'rgba(255, 255, 255, 0.05)';
    const textColor = '#9ca3af';

    Chart.defaults.color = textColor;
    Chart.defaults.borderColor = gridColor;

    // Status Chart
    const ctxStatus = document.getElementById('statusChart').getContext('2d');
    new Chart(ctxStatus, {
      type: 'pie',
      data: {
        labels: ['Liquidado', 'Aprovado (Fila)', 'Em Análise', 'Recusado'],
        datasets: [{
          data: [65, 15, 12, 6],
          backgroundColor: [
            '#10b981',
            '#ec4899',
            '#f59e0b',
            '#ef4444'
          ],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom' }
        }
      }
    });

    // Nature Chart
    const ctxNature = document.getElementById('natureChart').getContext('2d');
    new Chart(ctxNature, {
      type: 'bar',
      data: {
        labels: ['Reembolso', 'Fornecedores', 'Impostos', 'Adiantamento', 'Contratos Recorrentes'],
        datasets: [{
          label: 'Total Acumulado (R$)',
          data: [18500, 75000, 22000, 8500, 19220],
          backgroundColor: '#ec4899',
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: { grid: { color: gridColor }, ticks: { color: textColor } },
          x: { grid: { color: gridColor }, ticks: { color: textColor } }
        }
      }
    });
  </script>
</body>
</html>
